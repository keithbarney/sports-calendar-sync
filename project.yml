name: SportsCalendarSync
options:
  bundleIdPrefix: com.keithbarney
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.4"
    CURRENT_PROJECT_VERSION: 1790809115
    DEVELOPMENT_TEAM: BXKNJTU253
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  SportsCalendarSyncScreenshots:
    build:
      targets:
        SportsCalendarSync: all
    test:
      targets:
        - SportsCalendarSyncScreenshotTests
  SportsCalendarSync:
    build:
      targets:
        SportsCalendarSync: all
    run:
      commandLineArguments:
        "-seed-data": true
    archive:
      config: Release
    test:
      targets:
        - SportsCalendarSyncTests

targets:
  SportsCalendarSync:
    type: application
    platform: iOS
    sources:
      - path: SportsCalendarSync
        excludes:
          - Secrets.swift
      - path: SportsCalendarSyncWidget/WidgetContentView.swift
    settings:
      base:
        INFOPLIST_FILE: SportsCalendarSync/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.sportssync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Keep the local app separate from the App Store app on one phone.
          BUNDLE_DISPLAY_NAME: Sports Sync (L)
          PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.sportssync.local
          CODE_SIGN_ENTITLEMENTS: SportsCalendarSync/SportsCalendarSync.debug.entitlements
          SPORTS_URL_SCHEME: sportssync-local
        Release:
          BUNDLE_DISPLAY_NAME: Sports Sync
          CODE_SIGN_ENTITLEMENTS: SportsCalendarSync/SportsCalendarSync.entitlements
          SPORTS_URL_SCHEME: sportssync
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) mock-crest-*.png"
    dependencies:
      - target: SportsCalendarSyncWidget

  SportsCalendarSyncWidget:
    type: app-extension
    platform: iOS
    sources:
      - SportsCalendarSyncWidget
      - path: SportsCalendarSync/Models/TrackedGame.swift
      - path: SportsCalendarSync/Models/TrackedTeam.swift
      - path: SportsCalendarSync/Models/WidgetSnapshot.swift
      - path: SportsCalendarSync/Models/League.swift
    settings:
      base:
        INFOPLIST_FILE: SportsCalendarSyncWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.sportssync.widget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BXKNJTU253
      configs:
        Debug:
          # The local extension must also have its own bundle identifier.
          BUNDLE_DISPLAY_NAME: Sports Calendar Sync (L)
          PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.sportssync.local.widget
          CODE_SIGN_ENTITLEMENTS: SportsCalendarSyncWidget/SportsCalendarSyncWidget.debug.entitlements
        Release:
          BUNDLE_DISPLAY_NAME: Sports Calendar Sync
          CODE_SIGN_ENTITLEMENTS: SportsCalendarSyncWidget/SportsCalendarSyncWidget.entitlements

  SportsCalendarSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SportsCalendarSyncTests
    dependencies:
      - target: SportsCalendarSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.sportssync.tests
        GENERATE_INFOPLIST_FILE: YES

  SportsCalendarSyncScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SportsCalendarSyncScreenshotTests
    dependencies:
      - target: SportsCalendarSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithbarney.sportssync.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SportsCalendarSync
